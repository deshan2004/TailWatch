<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TailWatch</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: var(--dark-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.4);
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1;
        }

        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .floating-element {
            position: absolute;
            background: linear-gradient(135deg, rgba(77, 171, 247, 0.1) 0%, rgba(81, 207, 102, 0.1) 100%);
            border-radius: 50%;
            animation: float 20s infinite linear;
            opacity: 0.3;
        }

        .floating-element:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 60%;
            left: 80%;
            animation-delay: -5s;
        }

        .floating-element:nth-child(3) {
            width: 80px;
            height: 80px;
            top: 80%;
            left: 10%;
            animation-delay: -10s;
        }

        .floating-element:nth-child(4) {
            width: 120px;
            height: 120px;
            top: 30%;
            left: 90%;
            animation-delay: -15s;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-30px) rotate(120deg); }
            66% { transform: translateY(20px) rotate(240deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        .auth-card {
            background: rgba(37, 38, 43, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 2;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .auth-logo i {
            font-size: 2.5rem;
            color: var(--primary-color);
        }

        .auth-logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            margin: 0;
        }

        .auth-header h2 {
            font-size: 1.8rem;
            color: var(--text-color);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .auth-header p {
            color: var(--text-light);
            font-size: 1rem;
        }

        .auth-form .form-group {
            margin-bottom: 20px;
        }

        .auth-form label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .auth-form input, .auth-form select {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--transition);
            background: rgba(37, 38, 43, 0.8);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
        }

        .auth-form input:focus, .auth-form select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(77, 171, 247, 0.15);
            transform: translateY(-2px);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .terms-agreement {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .terms-agreement input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
            margin-top: 2px;
        }

        .terms-agreement a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .terms-agreement a:hover {
            text-decoration: underline;
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--dark-color);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(77, 171, 247, 0.4);
        }

        .auth-btn:active {
            transform: translateY(-1px);
        }

        .auth-divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-color);
            z-index: 1;
        }

        .auth-divider span {
            background: rgba(37, 38, 43, 0.9);
            padding: 0 15px;
            position: relative;
            z-index: 2;
        }

        .social-signup {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: rgba(37, 38, 43, 0.8);
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        .social-btn.google i { color: #db4437; }
        .social-btn.facebook i { color: #4267B2; }

        .auth-footer {
            text-align: center;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .auth-footer a:hover {
            color: #339af0;
            text-decoration: underline;
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            border-radius: 2px;
            background: var(--border-color);
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: var(--transition);
            border-radius: 2px;
        }

        .strength-weak { background: var(--danger-color); width: 33%; }
        .strength-medium { background: var(--warning-color); width: 66%; }
        .strength-strong { background: var(--secondary-color); width: 100%; }

        .strength-text {
            font-size: 0.8rem;
            margin-top: 5px;
            color: var(--text-light);
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .back-home a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: rgba(37, 38, 43, 0.8);
            color: var(--text-color);
            text-decoration: none;
            border-radius: 8px;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .back-home a:hover {
            background: var(--primary-color);
            color: var(--dark-color);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .auth-card {
                padding: 30px;
                margin: 20px;
            }
            
            .social-signup {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 25px 20px;
                margin: 15px;
            }

            .auth-logo h1 {
                font-size: 1.8rem;
            }

            .auth-header h2 {
                font-size: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .social-signup {
                flex-direction: column;
            }
            
            .back-home {
                top: 10px;
                left: 10px;
            }
            
            .back-home a {
                padding: 8px 12px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="videos/signup-bg.mp4" type="video/mp4">
            <source src="videos/signup.webm" type="video/webm">
            Your browser does not support HTML5 video. Please use a modern browser.
        </video>
        <div class="hero-overlay"></div>
    </div>

    <div class="back-home">
        <a href="index.html">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>
    </div>

    <div class="floating-elements">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-paw"></i>
                    <h1>TailWatch</h1>
                </div>
                <h2>Join Our Community</h2>
                <p>Create your account to start making a difference</p>
            </div>

            <form class="auth-form" id="signupForm" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="firstName" name="firstName" placeholder="First name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="lastName" name="lastName" placeholder="Last name" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number (Optional)</label>
                    <div class="input-with-icon">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                    </div>
                </div>

                <div class="form-group">
                    <label for="userType">I am a</label>
                    <div class="input-with-icon">
                        <i class="fas fa-users"></i>
                        <select id="userType" name="userType" required>
                            <option value="">Select your role</option>
                            <option value="volunteer">Volunteer</option>
                            <option value="veterinarian">Veterinarian</option>
                            <option value="animal_rescue">Animal Rescue Organization</option>
                            <option value="community_member">Community Member</option>
                            <option value="student">Student</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Password strength</div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                        <button type="button" class="password-toggle" id="toggleConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="terms-agreement">
                    <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                    <label for="agreeTerms">
                        I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>
                    </label>
                </div>

                <div class="terms-agreement">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">
                        Send me updates about stray dog welfare and community events
                    </label>
                </div>

                <button type="submit" class="auth-btn">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </button>

                <div class="auth-divider">
                    <span>Or sign up with</span>
                </div>

                <div class="social-signup">
                    <button type="button" class="social-btn google">
                        <i class="fab fa-google"></i>
                        Google
                    </button>
                    <button type="button" class="social-btn facebook">
                        <i class="fab fa-facebook-f"></i>
                        Facebook
                    </button>
                </div>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Sign in here</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const icon = this.querySelector('i');
            
            if (confirmPasswordInput.type === 'password') {
                confirmPasswordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                confirmPasswordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            let strength = 0;
            let text = 'Password strength';
            
            if (password.length >= 8) strength += 1;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 1;
            if (password.match(/\d/)) strength += 1;
            if (password.match(/[^a-zA-Z\d]/)) strength += 1;
            
            strengthBar.className = 'strength-bar';
            
            if (password.length > 0) {
                if (strength <= 1) {
                    strengthBar.classList.add('strength-weak');
                    text = 'Weak password';
                } else if (strength <= 2) {
                    strengthBar.classList.add('strength-medium');
                    text = 'Medium strength';
                } else {
                    strengthBar.classList.add('strength-strong');
                    text = 'Strong password';
                }
            }
            
            strengthText.textContent = text;
        });

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            
            if (password !== confirmPassword) {
                showErrorModal('Passwords Don\'t Match', 'Please make sure both passwords are identical');
                return;
            }
            
            if (!agreeTerms) {
                showErrorModal('Terms Required', 'Please agree to the Terms of Service and Privacy Policy.');
                return;
            }
            
            const strengthBar = document.getElementById('strengthBar');
            if (strengthBar.classList.contains('strength-weak')) {
                showErrorModal('Weak Password', 'Please choose a stronger password for better security.');
                return;
            }
            
            simulateAccountCreation();
        });

        document.querySelectorAll('.social-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const platform = this.classList.contains('google') ? 'Google' : 'Facebook';
                alert(`This would connect to ${platform} in a real application`);
            });
        });

        function showErrorModal(title, message) {
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(37, 38, 43, 0.95);
                backdrop-filter: blur(10px);
                border: 2px solid #e74c3c;
                border-radius: 15px;
                padding: 30px;
                z-index: 10000;
                text-align: center;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
                min-width: 300px;
                max-width: 400px;
                animation: fadeIn 0.3s ease-out;
            `;
            errorDiv.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <div style="width: 60px; height: 60px; background: #e74c3c; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;">
                        <i class="fas fa-exclamation-triangle" style="color: #fff; font-size: 1.5rem;"></i>
                    </div>
                    <h3 style="color: #fff; margin-bottom: 10px;">${title}</h3>
                    <p style="color: #ccc;">${message}</p>
                </div>
                <button onclick="this.parentElement.remove(); document.querySelector('.overlay-error')?.remove();" style="
                    background: #e74c3c;
                    color: #fff;
                    border: none;
                    padding: 12px 30px;
                    border-radius: 8px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s ease;
                ">
                    Try Again
                </button>
            `;
            errorDiv.classList.add('overlay-error');
            
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                z-index: 9999;
            `;
            overlay.onclick = function() {
                errorDiv.remove();
                overlay.remove();
            };
            
            document.body.appendChild(errorDiv);
            document.body.appendChild(overlay);
        }

        function simulateAccountCreation() {
            const submitBtn = document.querySelector('.auth-btn');
            const originalText = submitBtn.innerHTML;
            
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
            submitBtn.disabled = true;
            
            setTimeout(() => {
                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                const email = document.getElementById('email').value;
                const userType = document.getElementById('userType').value;
                
                let role = 'user';
                let redirectUrl = 'dashboard.html';
                
                if (userType === 'veterinarian' || 
                    userType === 'animal_rescue' || 
                    userType === 'community_member') {
                    role = 'staff';
                    redirectUrl = 'staff-dashboard.html';
                }
                
                localStorage.setItem('userRole', role);
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userName', `${firstName} ${lastName}`);
                localStorage.setItem('userType', userType);
                localStorage.setItem('signupSuccess', 'true');
                
                showSuccessModal(firstName, lastName, userType, redirectUrl);
                
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }, 2000);
        }

        function showSuccessModal(firstName, lastName, userType, redirectUrl) {
            const dashboardType = redirectUrl.includes('staff') ? 'Staff Dashboard' : 'Dashboard';
            const formattedUserType = userType.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
            
            const successDiv = document.createElement('div');
            successDiv.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(37, 38, 43, 0.95);
                backdrop-filter: blur(10px);
                border: 2px solid #51cf66;
                border-radius: 15px;
                padding: 30px;
                z-index: 10000;
                text-align: center;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
                min-width: 300px;
                max-width: 400px;
                animation: fadeIn 0.3s ease-out;
            `;
            successDiv.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <div style="width: 60px; height: 60px; background: #51cf66; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;">
                        <i class="fas fa-check" style="color: #fff; font-size: 1.5rem;"></i>
                    </div>
                    <h3 style="color: #fff; margin-bottom: 10px;">Welcome to TailWatch!</h3>
                    <p style="color: #ccc;">Account created successfully for ${firstName} ${lastName}</p>
                    <p style="color: #4dabf7; font-weight: 500; margin-top: 10px;">
                        Role: ${formattedUserType}
                    </p>
                    <p style="color: #ccc; font-size: 0.9rem; margin-top: 5px;">
                        You will be redirected to ${dashboardType}
                    </p>
                </div>
                <button id="continueBtn" style="
                    background: linear-gradient(135deg, #4dabf7, #51cf66);
                    color: #fff;
                    border: none;
                    padding: 12px 30px;
                    border-radius: 8px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s ease;
                ">
                    Continue to ${dashboardType}
                </button>
            `;
            
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                z-index: 9999;
            `;
            
            document.body.appendChild(successDiv);
            document.body.appendChild(overlay);
            
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 5000);
            
            document.getElementById('continueBtn').addEventListener('click', function() {
                window.location.href = redirectUrl;
            });
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
        `;
        document.head.appendChild(style);
    </script>
    
</body>
</html>
